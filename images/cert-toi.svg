<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <defs>
    <linearGradient id="toiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="toiRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="toiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="280" height="160" rx="14" fill="url(#toiBgGrad)" />
  <rect x="1" y="1" width="278" height="158" rx="13" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- TOI Brand Red Emblem -->
  <g transform="translate(32, 36)" filter="url(#toiShadow)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="url(#toiRedGrad)" />
    <!-- Classical Elephant / Pillars TOI Motif -->
    <path d="M15 36 L15 22 L25 15 L35 22 L35 36 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M25 15 L25 36 M19 26 L31 26" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(92, 53)">
    <text x="0" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A" letter-spacing="-0.3">Times Foundation</text>
    <text x="0" y="18" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#DC2626">The Times of India</text>
  </g>

  <!-- Pill -->
  <g transform="translate(32, 104)">
    <rect x="0" y="0" width="216" height="28" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2" />
    <circle cx="18" cy="14" r="5" fill="#DC2626" />
    <path d="M16 14 L17.5 15.5 L20.5 12.5" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
    <text x="32" y="18" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B" letter-spacing="0.4">COMMUNITY EXCELLENCE</text>
  </g>
</svg>
