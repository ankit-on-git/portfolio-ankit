<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <defs>
    <linearGradient id="infBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="infShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="280" height="160" rx="14" fill="url(#infBgGrad)" />
  <rect x="1" y="1" width="278" height="158" rx="13" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Infosys Brand Blue Emblem -->
  <g transform="translate(32, 36)" filter="url(#infShadow)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#007CC3" />
    <!-- Stylized 'i' / spring icon -->
    <circle cx="25" cy="18" r="4.5" fill="#FFFFFF" />
    <path d="M21 26 L29 26 L29 38 L21 38 Z" fill="#FFFFFF" />
    <!-- Dynamic spring wave -->
    <path d="M12 36 Q 25 43 38 36" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Infosys Springboard Wordmark -->
  <g transform="translate(92, 55)">
    <text x="0" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#007CC3" letter-spacing="-0.5">Infosys</text>
    <text x="0" y="18" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0284C7" letter-spacing="1">SPRINGBOARD</text>
  </g>

  <!-- Certification Banner -->
  <g transform="translate(32, 104)">
    <rect x="0" y="0" width="216" height="28" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
    <circle cx="18" cy="14" r="5" fill="#0284C7" />
    <path d="M16 14 L17.5 15.5 L20.5 12.5" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
    <text x="32" y="18" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0369A1" letter-spacing="0.4">OFFICIAL CERTIFICATION</text>
  </g>
</svg>
