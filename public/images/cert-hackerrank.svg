<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <defs>
    <linearGradient id="hrBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="hrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="280" height="160" rx="14" fill="url(#hrBgGrad)" />
  <rect x="1" y="1" width="278" height="158" rx="13" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- HackerRank Green Brandmark (Icon) -->
  <g transform="translate(32, 38)" filter="url(#hrShadow)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#00EA64" />
    <!-- HackerRank 'H' Logo Path -->
    <path d="M16 12 L21 12 L21 21 L27 21 L27 12 L32 12 L32 36 L27 36 L27 27 L21 27 L21 36 L16 36 Z" fill="#0E141E" />
  </g>

  <!-- HackerRank Wordmark -->
  <g transform="translate(90, 56)">
    <text x="0" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0E141E" letter-spacing="-0.5">HackerRank</text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#059669">Verified Skills</text>
  </g>

  <!-- Skill Certification Pill: Python -->
  <g transform="translate(32, 104)">
    <rect x="0" y="0" width="216" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" />
    <!-- Python Icon Dot -->
    <circle cx="18" cy="14" r="5" fill="#10B981" />
    <path d="M16 14 L17.5 15.5 L20.5 12.5" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
    <text x="32" y="18" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065F46" letter-spacing="0.5">PYTHON CERTIFIED</text>
  </g>
</svg>
