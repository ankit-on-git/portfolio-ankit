<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <defs>
    <linearGradient id="qzBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="qzBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="qzShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="280" height="160" rx="14" fill="url(#qzBgGrad)" />
  <rect x="1" y="1" width="278" height="158" rx="13" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Unstop Blue Brandmark -->
  <g transform="translate(32, 36)" filter="url(#qzShadow)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="url(#qzBlueGrad)" />
    <!-- Unstop 'U' / Lightning path -->
    <path d="M18 16 L18 28 C18 32 21 35 25 35 C29 35 32 32 32 28 L32 16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <circle cx="25" cy="22" r="3" fill="#FACC15" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(92, 53)">
    <text x="0" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A" letter-spacing="-0.3">Quizoff 2026</text>
    <text x="0" y="18" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#0284C7">Unstop Community</text>
  </g>

  <!-- Pill -->
  <g transform="translate(32, 104)">
    <rect x="0" y="0" width="216" height="28" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
    <circle cx="18" cy="14" r="5" fill="#0284C7" />
    <path d="M16 14 L17.5 15.5 L20.5 12.5" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
    <text x="32" y="18" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0369A1" letter-spacing="0.4">COMPETITIVE QUIZ</text>
  </g>
</svg>
