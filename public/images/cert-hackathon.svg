<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <defs>
    <linearGradient id="hkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="hkTrophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="hkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="280" height="160" rx="14" fill="url(#hkBgGrad)" />
  <rect x="1" y="1" width="278" height="158" rx="13" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Trophy Icon Box -->
  <g transform="translate(32, 36)" filter="url(#hkShadow)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="url(#hkTrophyGrad)" />
    <!-- Crisp Trophy SVG path -->
    <path d="M17 16 L33 16 C33 22 29 27 25 27 C21 27 17 22 17 16 Z M17 18 L13 18 C13 22 16 25 19 25 M33 18 L37 18 C37 22 34 25 31 25 M25 27 L25 32 M19 32 L31 32" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(92, 53)">
    <text x="0" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A" letter-spacing="-0.3">National Hackathon</text>
    <text x="0" y="18" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#D97706">Participation &amp; Excellence</text>
  </g>

  <!-- Pill: National Level -->
  <g transform="translate(32, 104)">
    <rect x="0" y="0" width="216" height="28" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
    <circle cx="18" cy="14" r="5" fill="#F59E0B" />
    <path d="M16 14 L17.5 15.5 L20.5 12.5" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
    <text x="32" y="18" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#92400E" letter-spacing="0.4">NATIONAL COMPETITION</text>
  </g>
</svg>
